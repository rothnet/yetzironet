{"name": "fetch", "on": ["push", "workflow_dispatch"], "permissions": {"contents": "write"}, "jobs": {"f": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "set -e\nU=http://204.168.252.233:8765/yetzironet.138.199.210.179.nip.io/public_html/wp-content/uploads\nfor y in 2020 2021 2022 2023 2024 2025 2026; do wget -q -r -np -nH --cut-dirs=4 -R 'index.html*' -e robots=off --restrict-file-names=nocontrol -P media \"$U/$y/\" || true; done\nfind media -type f -regextype posix-extended -regex '.*-[0-9]+x[0-9]+\\.[A-Za-z]+' -delete\nfind media -type f \\( -name '*-scaled.*' -o -name '*.jpg.webp' -o -name '*.jpeg.webp' -o -name '*.png.webp' -o -name 'index.html*' \\) -delete\nfind media -type f | wc -l\ndu -sh media\ngit config user.name media-bot\ngit config user.email media-bot@users.noreply.github.com\ngit add media\ngit commit -m 'Original media from Oct 31 backup'\ngit push\n"}]}}}
