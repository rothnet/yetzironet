{"name": "export", "on": {"push": {"paths": [".github/workflows/export.yml"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"e": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "python3 - <<'PYEOF'\nimport json, re, base64, urllib.request, urllib.parse, time, os\nUA={'User-Agent':'Mozilla/5.0'}\ndef get(u, tries=4):\n    for t in range(tries):\n        try:\n            return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=90).read().decode('utf-8','replace')\n        except Exception as e:\n            print('retry', u, e); time.sleep(5)\n    return ''\nos.makedirs('content/archive', exist_ok=True)\nj=json.loads(get('https://yetzironet.co.il/wp-json/wp/v2/pages/2699?_fields=content'))\nm=re.search(r'B64START([A-Za-z0-9+/=]+)B64END', j['content']['rendered'])\nposts=json.loads(base64.b64decode(m.group(1)).decode('utf-8'))\njson.dump(posts, open('content/wp-posts.json','w'), ensure_ascii=False, indent=1)\nres={}\npages=['']+[p['slug'] for p in posts]+['category/uncategorized']\nfor s in pages:\n    url='https://yetzironet.co.il/'+urllib.parse.quote(s)+('/' if s else '')\n    html=get('https://web.archive.org/web/2024id_/'+url)\n    if len(html)<2000: html=get('https://web.archive.org/web/2023id_/'+url)\n    name=(s or 'home').replace('/','_')\n    open('content/archive/'+name+'.html','w').write(html)\n    imgs=[urllib.parse.unquote(x) for x in re.findall(r'<img[^>]+src=\"([^\"]+)\"', html)]\n    res[name]=imgs\n    print(name, len(html), len(imgs))\njson.dump(res, open('content/archive-images.json','w'), ensure_ascii=False, indent=1)\nPYEOF\ngit config user.name media-bot\ngit config user.email media-bot@users.noreply.github.com\ngit add content\ngit commit -m 'Export WP content and archive pages'\ngit push\n"}]}}}
